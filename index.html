<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyWisely - Get started</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="logo-container">
    <img src="assets/moneywisely-icon.svg" class="logo-img" alt="">
    <span class="logo-text">MoneyWisely</span>
  </div>
  <header class="header">
    <h1>Welcome to MoneyWisely</h1>
    <p>Try MoneyWisely in demo mode. No password needed.</p>
  </header>

  <div class="sign-in-container">
    <form id="signInForm">
      <label for="username-field">Display name</label>
      <input type="text" id="username-field" name="displayname" placeholder="Jane Doe" maxlength="20" required>
      <button class="btn-1" type="submit">Continue</button>
    </form>

    <div class="note">
      <p>This demo stores data only in this browser</p>
    </div>
  </div>


  <script src="js/app.js"></script>
</body>

</html>
